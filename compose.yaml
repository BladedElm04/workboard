
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workboard_app
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: workboard
      DB_USERNAME: workboard
      DB_PASSWORD: workboard123
    depends_on:
      db:
        condition: service_healthy
    networks:
      - workboard_network

  db:
    image: postgres:16-alpine
    container_name: workboard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workboard
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: workboard123
    ports:
      - "5440:5432"
    volumes:
      - workboard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workboard -d workboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - workboard_network

  node:
    image: node:22-alpine
    container_name: workboard_node
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - workboard_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - workboard_network

volumes:
  workboard_postgres:
  workboard_node_modules:

networks:
  workboard_network:
    driver: bridge
